aid: arbol
name: Arbol
description: 'Arbol is a global climate risk solutions platform providing parametric
  and traditional insurance and weather derivatives. Founded in 2018 and headquartered
  in New York, Arbol combines AI/ML-driven underwriting, institutional-grade climate
  data sourced from NOAA, NASA and ESA, and dedicated risk capital to close the global
  insurance protection gap. Coverage spans agriculture, energy, travel, wildfire and
  reinsurance, with parametric products that pay out on objective weather triggers
  rather than loss adjustment. Its licensed underwriting arm, Arbol Insurance Services,
  holds binding authority from an A.M. Best "A" rated carrier and Lloyd''s coverholder
  status, and distributes named storm, precipitation, temperature, wind, snow, solar
  and soil-moisture products through licensed producers across all 50 U.S. states
  and the United Kingdom. Arbol does not publish a public developer API — the quoting,
  binding and policy-issuance surface is delivered through its broker/agent web platform.'
